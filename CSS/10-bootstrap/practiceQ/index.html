<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pricing</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="text-center mb-4">
            <h2>Pricing</h2>
            Please checkout out most effective payment models
        </div>
        <div class="row gx-5 gy-3">
            <div class="col-lg-4 col-md-6 text-center">
                <div class="card">
                    <div class="card-header text-center ">Free</div>
                    <div class="card-body text-center">
                        <h2>$0/mo</h2>
                        <p>10 users included<br>2GB of storage <br>Email support</p>
                        <button class="btn btn-outline-primary">sign up for free</button>
                    </div>
                </div>
            </div>

            <div class="col-lg-4 col-md-6 text-center">
                <div class="card">
                    <div class="card-header text-center">Pro</div>
                    <div class="card-body text-center">
                        <h2>$15/mo</h2>
                        <p>20 users included<br>10GB of storage <br>priority email support</p>
                        <button class="btn btn-primary">sign up for free</button>
                    </div>
                </div>

            </div>

            <div class="col-lg-4 col-md-12 text-center">
                <div class="card">
                    <div class="card-header text-center">Free</div>
                    <div class="card-body text-center">
                        <h2>$15/mo</h2>
                        <p>20 users included<br>10GB of storage <br>priority email support</p>
                        <button class="btn btn-primary">sign up for free</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
